summary:
  - I build sensing systems for health and human performance, with the long-term goal of improving how we monitor, support, and care for the silver generation.
  - Currently, I am a PhD candidate in Computer Science at Singapore Management University. Before that, I coached Division I football athletes at the University of Florida and worked on sensing research at Google and Fitbit, experiences that shaped how I think about turning data into practical decisions.
