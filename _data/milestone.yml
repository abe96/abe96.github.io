kicker: Milestone
date: Oct 21, 2026
title: Passed my PhD Qualifying Exam
talk: Towards Practical Real-time Sensing Systems for Fine-Grained Exercise Analysis
body: "I presented this work to my thesis committee. It brings together the two sides of my research: sports HCI studies of how coaches use sports-science tools, and real-time camera-based systems for fine-grained exercise tracking."
